<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12171d" />
    <title>ECG Studio · Recording review</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/review.js"></script>
  </head>
  <body class="review-window">
    <main>
      <section class="panel" aria-labelledby="review-title">
        <div class="panel-heading">
          <div class="panel-title"><h1 id="review-title">Recording review</h1><span class="badge" id="review-badge">NO RECORDING</span></div>
          <div class="review-picker"><label for="recording-select">Recording</label><select id="recording-select"><option value="">Loading…</option></select><a class="download-link" id="download-link" hidden download>Download CSV</a></div>
          <div class="speed-control" role="group" aria-label="Recording paper speed">
            <button class="selected" type="button" data-speed="25" aria-pressed="true">25 mm/s</button>
            <button type="button" data-speed="50" aria-pressed="false">50 mm/s</button>
          </div>
        </div>
        <div class="strip-viewport" tabindex="0" role="region" aria-label="ECG recording strip, scroll horizontally">
          <div class="ecg-paper recording-strip" data-paper-speed="25" role="img" aria-label="Empty ECG recording strip for Lead I">
            <canvas class="ecg-trace review-trace" aria-hidden="true"></canvas>
            <span class="lead-label">I <span>Lead I</span></span>
            <span class="paper-scale">25 mm/s · 10 mm/mV</span>
          </div>
        </div>
        <div class="panel-footer"><span id="review-source">No recording</span><span id="review-summary">Duration — / Samples —</span></div>
      </section>
      <footer class="app-footer">Experimental prototype. Not for medical or diagnostic use. Screen scale is approximate.</footer>
    </main>
  </body>
</html>
